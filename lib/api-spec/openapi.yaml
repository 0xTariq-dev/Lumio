openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyzer
    description: Consent-based URL and email analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analysis/status:
    get:
      operationId: getAnalysisStatus
      tags: [analyzer]
      summary: Get analyzer readiness and limits
      responses:
        "200":
          description: Current analyzer readiness and configured limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisStatus"
  /scans/url:
    post:
      operationId: createUrlScan
      tags: [analyzer]
      summary: Queue a consented URL scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UrlScanInput"
      responses:
        "202":
          description: Scan accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanAccepted"
        "400":
          description: Invalid URL or missing consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Scan limit or queue capacity reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Isolated worker is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scans/email:
    post:
      operationId: createEmailScan
      tags: [analyzer]
      summary: Queue a consented EML scan
      description: Accepts an .eml file up to 10 MB. The file is processed transiently and is not stored.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/EmailScanInput"
      responses:
        "202":
          description: Scan accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanAccepted"
        "400":
          description: Invalid file or missing consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: EML file exceeds 10 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Scan limit or queue capacity reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Isolated worker is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scans/{scanId}:
    get:
      operationId: getScan
      tags: [analyzer]
      summary: Get a transient scan status snapshot
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current scan state without a persisted report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSnapshot"
        "404":
          description: Scan expired or is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Isolated worker is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scans/{scanId}/explanation/stream:
    post:
      operationId: streamScanExplanation
      tags: [analyzer]
      summary: Stream an optional explanation of a completed report
      description: |
        Requires separate per-scan consent and a short-lived, browser-bound
        evidence token. Sends only a bounded, redacted evidence summary to
        Vultr Serverless Inference. The explanation cannot alter the report.
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplanationConsentInput"
      responses:
        "200":
          description: Server-Sent Events explanation stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request or missing consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Evidence token is invalid or belongs to another browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Evidence token has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Explanation token was already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Explanation capacity is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Inference provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scans/{scanId}/links/{linkId}:
    post:
      operationId: createSelectedEmailLinkScan
      tags: [analyzer]
      summary: Scan one selected email link after consent
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: linkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkScanConsent"
      responses:
        "202":
          description: Selected link scan accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanAccepted"
        "400":
          description: Missing consent or invalid scan/link reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Scan or selected link expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Scan limit or queue capacity reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Isolated worker is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scans/{scanId}/events:
    get:
      operationId: streamScanEvents
      tags: [analyzer]
      summary: Stream transient scan progress and final report
      description: |
        Server-Sent Events. Events are `progress` (ScanProgress), `completed` (ScanReport),
        or `failed` (ApiError). A completed report is delivered to the connected client only
        and is not retained server-side. EventSource is used by the client for this stream.
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Scan expired or is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Isolated worker is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scans/{scanId}/agent/approvals/{requestId}:
    post:
      operationId: resolveAgentApproval
      tags: [analyzer]
      summary: Approve or decline one proposed agent action
      description: |
        Resolves one browser-bound, single-use approval request. The request
        is validated against the reviewed tool catalog before it can exist.
        Approval does not authorize another tool or data scope.
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentApprovalDecisionInput"
      responses:
        "200":
          description: Approval request resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentApprovalResponse"
        "400":
          description: Invalid approval request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Approval belongs to another browser session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Approval request is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Approval request was already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scans/{scanId}/agent/proposals:
    post:
      operationId: createAgentProposal
      tags: [analyzer]
      summary: Request one approval-gated follow-up proposal
      description: Requires a completed deterministic scan. The response is a pending proposal; no tool is dispatched.
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProposalTriggerInput"
      responses:
        "202":
          description: Approval-gated proposal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentApprovalRequest"
        "400":
          description: Invalid scan type or reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Scan is not complete or no proposal is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Scan status is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scans/{scanId}/agent/cancel:
    post:
      operationId: cancelAgentApprovals
      tags: [analyzer]
      summary: Cancel pending agent approval requests
      description: Cancels pending approval prompts for this browser-bound scan.
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pending approval requests canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCancellationResponse"
        "400":
          description: Invalid scan reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scans/{scanId}/agent/events:
    get:
      operationId: streamAgentApprovalEvents
      tags: [analyzer]
      summary: Stream browser-bound agent approval events
      description: Streams approval_required and approval_resolved events for this browser-bound scan.
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Server-Sent Events approval stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid scan reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalysisStatus:
      type: object
      required: [workerStatus, scannerAvailable, queue, limits, scanQuota]
      properties:
        workerStatus:
          type: string
          enum: [ready, unavailable]
        scannerAvailable:
          type: boolean
        queue:
          $ref: "#/components/schemas/QueueStatus"
        limits:
          $ref: "#/components/schemas/ScanLimits"
        scanQuota:
          $ref: "#/components/schemas/ScanQuotaStatus"
    ScanQuotaStatus:
      type: object
      required: [enabled, daily, lifetime]
      properties:
        enabled:
          type: boolean
          description: Whether the daily and lifetime per-client caps are enforced.
        daily:
          $ref: "#/components/schemas/ScanQuotaWindow"
        lifetime:
          $ref: "#/components/schemas/ScanQuotaWindow"
    ScanQuotaWindow:
      type: object
      required: [used, total]
      properties:
        used:
          type: [integer, "null"]
          minimum: 0
          description: Null when quota caps are disabled.
        total:
          type: integer
          const: 15
    QueueStatus:
      type: object
      required: [active, queued, activeLimit, queuedLimit]
      properties:
        active:
          type: integer
          minimum: 0
        queued:
          type: integer
          minimum: 0
        activeLimit:
          type: integer
          const: 1
        queuedLimit:
          type: integer
          const: 10
    ScanLimits:
      type: object
      required:
        - maxUrlLength
        - maxEmailBytes
        - maxExtractedLinks
        - browserTimeoutSeconds
        - sandboxKillSeconds
        - startsPerMinute
        - startsPerDay
        - lifetimeStartsPerIp
      properties:
        maxUrlLength:
          type: integer
          const: 2048
        maxEmailBytes:
          type: integer
          const: 10485760
        maxExtractedLinks:
          type: integer
          const: 50
        browserTimeoutSeconds:
          type: integer
          const: 90
        sandboxKillSeconds:
          type: integer
          const: 180
        startsPerMinute:
          type: integer
          const: 2
        startsPerDay:
          type: integer
          const: 15
        lifetimeStartsPerIp:
          type: integer
          const: 15
    UrlScanInput:
      type: object
      required: [url, consent]
      properties:
        url:
          type: string
          description: Absolute HTTP(S) URL or bare public domain/IP. Bare targets use HTTPS.
          minLength: 1
          maxLength: 2048
        consent:
          type: boolean
          enum: [true]
    EmailScanInput:
      type: object
      required: [file, consent]
      properties:
        file:
          type: string
          format: binary
          description: An .eml file, at most 10 MB.
        consent:
          type: boolean
          enum: [true]
    LinkScanConsent:
      type: object
      required: [consent]
      properties:
        consent:
          type: boolean
          enum: [true]
    ExplanationConsentInput:
      type: object
      required: [consent, explanationToken]
      properties:
        consent:
          type: boolean
          enum: [true]
        explanationToken:
          type: string
          minLength: 1
          maxLength: 12000
    AgentApprovalDecisionInput:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, decline]
    AgentProposalTriggerInput:
      type: object
      required: [scanType]
      additionalProperties: false
      properties:
        scanType:
          type: string
          enum: [url, email, email_link]
    AgentApprovalRequest:
      type: object
      required: [requestId, scanId, proposal, status, expiresAt]
      properties:
        requestId:
          type: string
          format: uuid
        scanId:
          type: string
          format: uuid
        proposal:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [pending]
        expiresAt:
          type: string
          format: date-time
    AgentApprovalResponse:
      type: object
      required: [requestId, scanId, status]
      properties:
        requestId:
          type: string
          format: uuid
        scanId:
          type: string
          format: uuid
        status:
          type: string
          enum: [approved, declined]
    AgentCancellationResponse:
      type: object
      required: [scanId, cancelledApprovalRequests]
      properties:
        scanId:
          type: string
          format: uuid
        cancelledApprovalRequests:
          type: integer
          minimum: 0
    ScanAccepted:
      type: object
      required: [scanId, status, eventsPath, expiresAt]
      properties:
        scanId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running]
        eventsPath:
          type: string
        expiresAt:
          type: string
          format: date-time
    ScanSnapshot:
      type: object
      required: [scanId, type, status, createdAt, expiresAt]
      properties:
        scanId:
          type: string
          format: uuid
        type:
          type: string
          enum: [url, email, email_link]
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        latestProgress:
          $ref: "#/components/schemas/ScanProgress"
    ScanProgress:
      type: object
      required: [stage, message, completedSteps, totalSteps]
      properties:
        stage:
          type: string
          enum:
            - validating
            - queued
            - starting_sandbox
            - navigating
            - collecting_evidence
            - http_failed
            - browser_inspection
            - browser_completed
            - browser_skipped
            - browser_blocked
            - browser_failed
            - analyzing_email
            - building_report
            - completed
            - failed
        message:
          type: string
          maxLength: 160
        completedSteps:
          type: integer
          minimum: 0
        totalSteps:
          type: integer
          minimum: 1
        plan:
          type: array
          minItems: 4
          maxItems: 6
          items:
            $ref: "#/components/schemas/ScanPlanStep"
    ScanPlanStep:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          enum: [consent_target, sandbox, http, static, browser, email_parse, report]
        status:
          type: string
          enum: [pending, running, completed, skipped, failed, blocked]
        reasonCode:
          type: string
          enum:
            - consent_checked
            - no_browser_required
            - redirect_blocked
            - not_html
            - static_body_limit
            - http_unavailable
            - http_fetch_failed
            - browser_error
            - earlier_step_failed
            - analysis_failed
    ScanReport:
      type: object
      required: [scanId, type, riskBand, completedAt, ruleSetVersion, findings, coverage]
      properties:
        scanId:
          type: string
          format: uuid
        type:
          type: string
          enum: [url, email, email_link]
        riskBand:
          type: string
          enum: [low, moderate, high, critical, inconclusive]
        completedAt:
          type: string
          format: date-time
        ruleSetVersion:
          type: string
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ScanFinding"
        coverage:
          $ref: "#/components/schemas/ScanCoverage"
        explanationToken:
          type: string
          maxLength: 12000
          description: Short-lived token binding redacted evidence to this browser; not part of the exported report.
        executionPlan:
          type: array
          minItems: 4
          maxItems: 6
          items:
            $ref: "#/components/schemas/ScanPlanStep"
        links:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/EmailLink"
    ScanFinding:
      type: object
      required: [id, title, explanation, severity, strength, source]
      properties:
        id:
          type: string
        title:
          type: string
          maxLength: 100
        explanation:
          type: string
          maxLength: 500
        severity:
          type: string
          enum: [informational, low, moderate, high, critical]
        strength:
          type: string
          enum: [direct, contextual]
        source:
          type: string
          enum: [url_navigation, browser, email_headers, email_body, attachment_metadata]
        sanitizedObservedValue:
          type: ["string", "null"]
          maxLength: 300
        limitations:
          type: array
          items:
            type: string
            maxLength: 200
    ScanCoverage:
      type: object
      required: [sufficient, checks]
      properties:
        sufficient:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CoverageCheck"
    CoverageCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          maxLength: 80
        status:
          type: string
          enum: [completed, skipped, blocked, failed]
        reason:
          type: ["string", "null"]
          maxLength: 200
    EmailLink:
      type: object
      required: [linkId, anchorText, displayUrl, targetHost, scanAvailable]
      properties:
        linkId:
          type: string
          format: uuid
        anchorText:
          type: string
          maxLength: 200
        displayUrl:
          type: string
          maxLength: 300
          description: Sanitized display URL with query values and fragments redacted.
        targetHost:
          type: string
          maxLength: 253
        scanAvailable:
          type: boolean
    ApiError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
          maxLength: 240
        retryable:
          type: boolean
        retryAfterSeconds:
          type: ["integer", "null"]
          minimum: 0

