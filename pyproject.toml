requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "microsandbox==0.7.13",
    "patchright==1.62.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "curl-cffi==0.16.3",
    "patchright==1.62.1",
    "playwright==1.64.1",
    "scrapling==0.5.1",
]

[tool.uv]
package = false
