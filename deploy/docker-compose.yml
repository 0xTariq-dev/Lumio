name: veridict

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ${DATABASE_ENV_FILE:-/etc/veridict/db.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - database-private
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  api:
    image: veridict-api:2026-11-08
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      - ${API_ENV_FILE:-/etc/veridict/api.env}
    environment:
      NODE_ENV: production
      PORT: "8080"
      NODE_EXTRA_CA_CERTS: /etc/veridict/worker-ca.pem
      TRUSTED_PROXY_CIDRS: "10.0.1.0/24,172.30.0.0/24"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${WORKER_CA_FILE:-/etc/veridict/worker-ca.pem}:/etc/veridict/worker-ca.pem:ro
    networks:
      - app-private
      - database-private
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    image: veridict-web:2026-11-08
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - app-private
      - coolify
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /var/run:size=1m,noexec,nosuid
      - /tmp:size=8m,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - 'traefik.http.routers.veridict-http.rule=Host(`${VERIDICT_HOST}`)'
      - traefik.http.routers.veridict-http.entrypoints=http
      - traefik.http.routers.veridict-http.middlewares=veridict-https-redirect
      - traefik.http.middlewares.veridict-https-redirect.redirectscheme.scheme=https
      - 'traefik.http.routers.veridict-https.rule=Host(`${VERIDICT_HOST}`)'
      - traefik.http.routers.veridict-https.entrypoints=https
      - traefik.http.routers.veridict-https.tls=true
      - traefik.http.routers.veridict-https.tls.certresolver=letsencrypt
      - traefik.http.services.veridict.loadbalancer.server.port=8080

networks:
  app-private:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  coolify:
    external: true
  database-private:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  db-data:
    name: veridict-db-data
